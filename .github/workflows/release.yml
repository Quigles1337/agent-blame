name: Release

# Publishes the package to npm when a version tag is pushed.
#
# Authentication is npm trusted publishing (OIDC): there is no npm token in
# this repository, and npm attaches a provenance attestation to every version
# published this way. One-time setup and the release steps are in
# docs/releasing.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token that npm exchanges for a publish credential

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in a release build
      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: npm is new enough for trusted publishing
        run: |
          npm --version
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error('npm 11.5.1 or later is required for trusted publishing'); process.exit(1); }
          " "$(npm --version)"
      - name: Unit and end-to-end tests
        run: npm test
      - name: Package contents are clean
        run: npm pack --dry-run
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish"
          else
            npm publish
          fi
