name: PR report

# The action from this repository, run on its own pull requests: a sticky
# comment with the AI-assisted share of the lines each pull request adds.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          mode: pr
          comment: true
